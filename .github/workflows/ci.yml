name: CI pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly run so newly-disclosed advisories surface without a commit.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# A newer commit on the same branch/PR supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the whole pipeline only needs to read the repo.
permissions:
  contents: read

jobs:
  check-build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke-test built artifacts (ESM + CJS resolve and export the API)
        run: |
          node --input-type=module   -e "import('triauth').then(m=>{if(typeof m.authenticate!=='function')throw new Error('ESM entry broken')})"
          node --input-type=commonjs -e "if(typeof require('triauth').authenticate!=='function')throw new Error('CJS entry broken')"

  test:
    name: Tests ${{ matrix.os }} node-${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm test

  # Bun and Deno run the unit tests and the nine JSON conformance suites. The live zone tests
  # stay off on these two runtimes, because their node:dns builds differ from Node. Bun delivers
  # TXT chunks UTF-8-decoded and as separate records. Deno reports SERVFAIL as ENODATA. The
  # mocha entry file is called directly, so the Node shebang in node_modules/.bin is not followed.
  test-bun:
    name: Tests ubuntu-latest bun-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: npm ci
      - name: Run unit tests and JSON suites on Bun
        run: TRIAUTH_SKIP_ZONE_TESTS=1 bun node_modules/mocha/bin/mocha.js --timeout 25000 --require ./test/setup.js test/test.js

  test-deno:
    name: Tests ubuntu-latest deno-2.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Run unit tests and JSON suites on Deno
        run: TRIAUTH_SKIP_ZONE_TESTS=1 deno run -A --node-modules-dir=manual node_modules/mocha/bin/mocha.js --timeout 25000 --require ./test/setup.js test/test.js

  dependency-audit:
    name: devDependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
