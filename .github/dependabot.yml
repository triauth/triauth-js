version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA and the
  # version comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Keep build/test tooling patched. This package has zero runtime dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 types JSDoc `@param {object}` strictly; moving needs a
      # source-wide annotation pass, so majors arrive by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # mocha 12 needs Node 20.19+, while this package supports Node 18.
      - dependency-name: mocha
        update-types: ["version-update:semver-major"]
